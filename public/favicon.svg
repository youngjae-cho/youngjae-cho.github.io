<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MAGI mark">
  <!-- The site's one repeated shape: a filled signal plate with the corner
       raked off, matching clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%).
       Punched out of it, the MAGI triangle — three peers, research on top.
       Transparent ground so the plate reads on a light or dark tab bar. -->
  <path d="M2 2H30V22.2L22.2 30H2Z" fill="#ff3b00"/>
  <circle cx="16" cy="10.8" r="3.4" fill="#000"/>
  <circle cx="10.4" cy="21.2" r="3.4" fill="#000"/>
  <circle cx="21.6" cy="21.2" r="3.4" fill="#000"/>
</svg>
